name: vayro
description: "VAYRO — Move as One. Premium Group Travel & Real-Time Travel Coordination Platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1

  # Declarative Routing
  go_router: ^14.2.0

  # Networking & HTTP Client
  dio: ^5.4.3+1

  # Local Persistence & SQLite
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure Storage for tokens & sensitive device secrets
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

